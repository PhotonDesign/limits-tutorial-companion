# Registry of validation scripts.  Each [[check]] is run by run_all.py; add new checks here
# (one entry per script) rather than editing run_all.py.
#
#   id       short unique name (used for the output log file name)
#   section  tutorial section number
#   script   path relative to the repository root
#   claims   tutorial equations / statements the script tests (tutorial LaTeX labels in [])
#   owner    "ODM" or "FM" (which author's section)

[[check]]
id = "power-formula"
section = "3.1.2"
script = "sec3_1_free_space_focusing/power_normalization_check.py"
claims = ["plane-wave z-power P = (2 pi^2/Z0) sum int (k_z/k)|c|^2"]
owner = "ODM"

